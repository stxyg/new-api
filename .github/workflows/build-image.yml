name: Build Docker Image

on:
  # 手动触发（Actions 页面选分支运行）
  workflow_dispatch:
  push:
    branches:
      - custom
    tags:
      - "v*"
  # 每月自动重建一次，跟进 debian/go 基础镜像安全补丁
  schedule:
    - cron: "0 3 1 * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and stamp version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          sha="sha-${GITHUB_SHA::7}"
          base=""
          # 1) 本次推送打的是 v* tag，直接用它
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            base="${GITHUB_REF#refs/tags/}"
          # 2) 否则找提交历史上最近的官方版本 tag
          else
            base="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"
          fi
          # 3) 都没有时用日期兜底，避免显示未知版本
          if [[ -z "$base" ]]; then
            base="v0.0.1-dev$(date -u +%Y%m%d)"
          fi
          version="${base}+custom.${sha}"
          printf '%s' "$version" > VERSION
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Stamped VERSION -> $(cat VERSION)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 只需要 amd64 时改成 linux/amd64 可大幅节省私有仓 Actions 分钟数
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.ver.outputs.value }}
          build-args: |
            TARGETOS
            TARGETARCH
          cache-from: type=gha
          cache-to: type=gha,mode=max
